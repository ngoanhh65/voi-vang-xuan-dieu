<style>
:root{--cream:#fffdf2;--butter:#f8edaa;--yellow:#f4d96b;--green:#66845b;--sage:#dce8cb;--deep:#304b37;--text:#344535;--muted:#74806c;--white:#fffef8;--pink:#e99b8b}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:'DM Sans',sans-serif;color:var(--text)}
.deck{height:100svh;position:relative;overflow:hidden;background:radial-gradient(circle at 85% 15%,#fff1b7 0 9%,transparent 10%),linear-gradient(135deg,#fff9df,#edf2dc 55%,#f9e8c6)}
.deck:before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.25;background-image:radial-gradient(#91a27a 1px,transparent 1px);background-size:19px 19px}
.top{position:absolute;z-index:30;top:17px;left:26px;right:26px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:.72rem;letter-spacing:.15em;font-weight:800;color:#718453}.sound{border:1px solid #e5e6cf;background:#fffef2;color:var(--deep);border-radius:99px;padding:10px 15px;font:700 .84rem 'DM Sans';cursor:pointer;box-shadow:0 6px 18px #405c3012}
.slide{position:absolute;inset:0;padding:76px clamp(25px,7vw,100px) 92px;display:grid;grid-template-columns:1.08fr .92fr;gap:3vw;align-items:center;opacity:0;visibility:hidden;pointer-events:none;overflow:auto}
.slide.active{opacity:1;visibility:visible;pointer-events:auto}.slide:after{content:"";position:fixed;inset:12px;border:1px solid #fff9d8;border-radius:30px;pointer-events:none}
.copy{max-width:740px;position:relative;z-index:3}.eyebrow{font-size:.75rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800;color:#9b8a35;margin-bottom:13px}.title{font:800 clamp(2.55rem,5.3vw,5.2rem)/1.05 'Playfair Display',Georgia,serif;letter-spacing:-.035em;color:var(--deep);margin:0 0 20px}.title em{font-style:normal;color:#b29a32}.subtitle{font-size:clamp(.98rem,1.3vw,1.12rem);line-height:1.85;color:#596b53;max-width:690px}.lead{font:700 clamp(1.2rem,2vw,1.75rem)/1.5 'Playfair Display';color:#936c34}.tag{display:inline-block;background:#fffef8;border:1px solid #e9e7d0;border-radius:99px;padding:7px 12px;margin:5px 5px 0 0;font-size:.8rem;color:#61724e}
.panel{background:#fffef4e8;border:1px solid #e8e9d6;border-radius:23px;padding:18px 21px;margin:11px 0;box-shadow:0 12px 32px #435b360c}.panel h3{font:700 1.2rem 'Playfair Display';color:#8f7731;margin:0 0 8px}.panel p,.panel li{line-height:1.72;margin-top:5px}.quote{font:700 clamp(1.25rem,2.1vw,1.8rem)/1.55 'Playfair Display';color:#8a6934;border-left:5px solid var(--yellow);padding-left:18px;margin:22px 0}.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.art{position:relative;min-height:380px;display:grid;place-items:center}.sun-disc{position:absolute;width:min(29vw,290px);aspect-ratio:1;border-radius:50%;background:#f8edaa;right:7%;top:7%;box-shadow:0 0 0 17px #f8edaa55}.plant-card{position:relative;z-index:1;width:min(360px,90%);height:380px;background:#e5edcf;border:9px solid #fffef8;border-radius:48% 48% 28px 28px;box-shadow:0 22px 55px #50683a1c;display:grid;place-items:center;overflow:hidden;animation:plantFloat 5s ease-in-out infinite}.plant-card svg{width:95%;height:95%}.float-label{position:absolute;z-index:4;background:#fffef8;border:1px solid #e7e5ca;border-radius:17px;padding:10px 14px;box-shadow:0 10px 25px #42533a12;font-size:.85rem;color:#526849}.float-label.a{left:0;top:20%;animation:drift 4s ease-in-out infinite}.float-label.b{right:0;bottom:12%;animation:drift 4.7s ease-in-out infinite reverse}
.nav{position:absolute;z-index:50;bottom:19px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;background:#fffef2ed;border:1px solid #e8e8d5;border-radius:99px;padding:8px 12px;box-shadow:0 9px 28px #405b3020}.nav button,.restart{border:0;border-radius:99px;background:var(--deep);color:#fffef8;padding:11px 17px;font:700 .86rem 'DM Sans';cursor:pointer;transition:transform .2s}.nav button:hover,.restart:hover{transform:translateY(-2px)}.nav button:disabled{opacity:.35;cursor:not-allowed;transform:none}.counter{font-size:.8rem;font-weight:800;min-width:58px;text-align:center;color:#60724f}.progress{position:absolute;z-index:55;bottom:0;left:0;height:5px;width:0;background:linear-gradient(90deg,#f2d45e,#7d9e68);transition:width .4s}
.intro{position:absolute;inset:0;z-index:100;display:grid;place-items:center;text-align:center;background:radial-gradient(circle at 50% 40%,#fff7cb 0,#f8edaa 48%,#dce8cb 100%);transition:opacity .8s,visibility .8s}.intro.hide{opacity:0;visibility:hidden;pointer-events:none}.intro-card{max-width:760px;padding:30px 24px;position:relative;z-index:2}.intro h1{font:800 clamp(3.7rem,10vw,8rem)/.95 'Playfair Display';letter-spacing:-.05em;color:var(--deep);margin:16px 0}.intro h1 em{color:#b29a32;font-style:normal}.intro p{line-height:1.8;color:#637454}.begin{border:0;border-radius:99px;padding:14px 23px;background:var(--deep);color:#fffef8;font:800 .9rem 'DM Sans';cursor:pointer;box-shadow:0 9px 24px #304b3730}
.butterfly{position:absolute;font-size:32px;animation:butterflyFly 8s ease-in-out infinite}.bf1{top:18%;left:13%}.bf2{top:27%;right:15%;animation-delay:-3s}.bf3{bottom:17%;left:22%;animation-delay:-5s}
.decor{position:absolute;pointer-events:none;z-index:1;animation:floaty 7s ease-in-out infinite}.d1{left:4%;top:18%;font-size:27px}.d2{right:6%;top:27%;font-size:22px;animation-delay:-3s}.d3{left:8%;bottom:18%;font-size:20px;animation-delay:-4s}
.slide.active .copy{animation:rise .65s cubic-bezier(.2,.75,.25,1) both}.slide.active .art{animation:pop .8s cubic-bezier(.16,.8,.25,1) both}.slide.fx-1.active .copy{animation:right .7s both}.slide.fx-1.active .art{animation:left .8s both}.slide.fx-2.active .copy{animation:zoom .7s both}.slide.fx-2.active .art{animation:spin .85s both}.slide.fx-3.active .copy{animation:bottom .7s both}.slide.fx-4.active .copy{animation:flip .7s both}.slide.fx-5.active .copy{animation:left .7s both}.slide.fx-5.active .art{animation:zoom .8s both}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}@keyframes pop{from{opacity:0;transform:scale(.82) rotate(4deg)}to{opacity:1;transform:none}}@keyframes right{from{opacity:0;transform:translateX(75px)}to{opacity:1;transform:none}}@keyframes left{from{opacity:0;transform:translateX(-65px)}to{opacity:1;transform:none}}@keyframes bottom{from{opacity:0;transform:translateY(65px)}to{opacity:1;transform:none}}@keyframes zoom{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:scale(1)}}@keyframes spin{from{opacity:0;transform:rotate(-9deg) scale(.8)}to{opacity:1;transform:none}}@keyframes flip{from{opacity:0;transform:perspective(900px) rotateY(-18deg) translateX(35px)}to{opacity:1;transform:none}}@keyframes plantFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes drift{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px) rotate(2deg)}}@keyframes floaty{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-17px) rotate(7deg)}}@keyframes butterflyFly{0%,100%{transform:translate(0,0) rotate(-12deg)}50%{transform:translate(55px,-38px) rotate(18deg)}}
.single{grid-template-columns:1fr;text-align:center}.single .copy{max-width:900px;margin:auto}.single .subtitle{margin:0 auto}.single .quote{display:inline-block;text-align:left}
@media(max-width:780px){.slide{grid-template-columns:1fr;align-content:start;padding:72px 25px 95px;gap:0}.art{min-height:210px;max-height:28vh}.plant-card{height:230px;width:230px}.sun-disc{width:180px}.float-label{font-size:.72rem;padding:7px 10px}.title{font-size:clamp(2.4rem,10vw,4rem)}.subtitle{font-size:.94rem;line-height:1.7}.panel{padding:14px 17px;margin:8px 0}.cols{grid-template-columns:1fr}.slide:after{inset:6px;border-radius:20px}.decor{display:none}.top{left:18px;right:18px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><main class="deck" id="deck">
<div class="decor d1">🌼</div><div class="decor d2">🍋</div><div class="decor d3">🌿</div>
<div class="intro" id="intro"><span class="butterfly bf1">🦋</span><span class="butterfly bf2">🦋</span><span class="butterfly bf3">🦋</span><div class="intro-card"><div class="eyebrow">Một cuộc dạo chơi cùng thi ca</div><h1>VỘI <em>VÀNG</em></h1><p>Xuân Diệu · Thơ mới<br>Mở cánh cửa khu vườn mùa xuân, nơi mỗi chiếc lá, cánh hoa đều kể một câu chuyện về tình yêu cuộc sống.</p><button class="begin" id="begin">🌼 MỞ KHU VƯỜN THI CA</button><p style="font-size:.8rem">Nhấn để bắt đầu · Có thể bật/tắt nhạc nền</p></div></div>
<div class="top"><div class="brand">✿ KHU VƯỜN THI CA · XUÂN DIỆU</div><button class="sound" id="sound">♫ Bật giai điệu</button></div>

<script>
const data=[
["01 / Khởi đầu","Vội vàng<br><em>Xuân Diệu</em>","“Sống toàn tâm, yêu hết mình và nâng niu từng khoảnh khắc.”","Một tiếng gọi thiết tha trước vẻ đẹp trần thế; một trái tim nhận ra thời gian trôi chảy và muốn sống sâu sắc hơn với cuộc đời.",["Thơ mới","Cái tôi cá nhân","Tình yêu cuộc sống"],null,"lemon","A little sunshine"],
["02 / Chân dung thi sĩ","Xuân Diệu –<br><em>nhà thơ của mùa xuân</em>","","Xuân Diệu (1916–1985), tên khai sinh Ngô Xuân Diệu, quê gốc Hà Tĩnh, sinh tại Bình Định. Ông là gương mặt tiêu biểu của phong trào Thơ mới, được Hoài Thanh nhận xét là “nhà thơ mới nhất trong các nhà thơ mới”.",null,[["Hồn thơ đặc trưng","Say mê vẻ đẹp trần thế, thiên nhiên và tình yêu. Cái tôi cá nhân mãnh liệt, luôn khao khát giao cảm với đời. Nhạy cảm trước bước đi của thời gian, tuổi trẻ và sự hữu hạn."]],"flower","Nắng và hoa"],
["03 / Tác phẩm","Một tiếng nói<br><em>của Thơ mới</em>","","",null,[["Xuất xứ – vị trí","“Vội vàng” in trong tập Thơ thơ (1938), tập thơ đầu tay và có ý nghĩa quan trọng trong sự nghiệp Xuân Diệu. Tác phẩm tiêu biểu cho hồn thơ trước Cách mạng: trẻ trung, nồng nàn, yêu đời và luôn ý thức về thời gian."],["Thể thơ – mạch cảm xúc","Thơ tự do, câu thơ dài ngắn linh hoạt, nhịp điệu biến đổi theo cảm xúc. Mạch thơ đi từ ước muốn níu giữ vẻ đẹp, say sưa trước thiên nhiên đến nỗi băn khoăn về thời gian và lời giục giã sống hết mình."]],"book","Trang thơ"],
["04 / Nhan đề","Vì sao là<br><em>“Vội vàng”?</em>","","Nhan đề gợi nhịp sống gấp gáp, cuống quýt, nhưng không đơn thuần là hấp tấp. Đó là thái độ sống được thúc đẩy bởi tình yêu đời mãnh liệt và ý thức sâu sắc rằng thời gian không chờ đợi con người.",null,null,"clock","Thời gian","“Vội vàng” là cách trái tim muốn sống trọn vẹn trước khi vẻ đẹp và tuổi trẻ đi qua."],
["05 / Khát vọng níu giữ","Muốn giữ lại<br><em>vẻ đẹp cuộc đời</em>","","Mở đầu bài thơ là một ước muốn táo bạo: can thiệp vào quy luật tự nhiên để giữ màu sắc, hương thơm và ánh sáng. Cái tôi trữ tình không thụ động ngắm nhìn mà muốn ôm lấy, lưu giữ vẻ đẹp đang trôi qua.",null,[["Ý nghĩa","Ước muốn phi thực tế lại bộc lộ một tình yêu rất thật: nhà thơ quá trân trọng sự sống nên không muốn bất cứ vẻ đẹp nào phai tàn."]],"sunflower","Bông hoa nắng"],
["06 / Bức tranh thiên đường","Thiên nhiên<br><em>như khu vườn tình yêu</em>","","Thế giới hiện lên căng tràn sức sống: ong bướm, hoa lá, đồng nội, ánh sáng, âm thanh và hương thơm. Thiên nhiên được cảm nhận bằng mọi giác quan, mang vẻ đẹp gần gũi, trẻ trung và đầy quyến rũ.",null,[["Hình ảnh","Mùa xuân, ánh sáng, hương sắc, âm thanh, sự sinh sôi."],["Cảm xúc","Say mê, ngây ngất, vui sướng, muốn giao hòa với vạn vật."]],"garden","Khu vườn mùa xuân"],
["07 / Cách cảm nhận độc đáo","Thế giới qua<br><em>lăng kính tình yêu</em>","","Nhà thơ lấy con người, đặc biệt là tuổi trẻ và tình yêu, làm chuẩn mực thẩm mỹ để khám phá thiên nhiên. Cảnh vật vì thế mang vẻ đẹp tình tứ, có đôi có lứa, gần gũi với cảm xúc con người.",null,[["Nghệ thuật nổi bật","Liệt kê dồn dập, điệp từ và cấu trúc trùng điệp; so sánh, ẩn dụ, nhân hóa giàu sức gợi; hình ảnh mới lạ, cảm giác giao thoa giữa nhiều giác quan; nhịp thơ biến đổi linh hoạt."]],"butterfly","Cánh bướm"],
["08 / Nhận thức về thời gian","Thời gian<br><em>không đứng đợi</em>","","Sau phút say mê là một chuyển biến đầy day dứt. Thời gian được cảm nhận như dòng chảy một chiều: mùa xuân qua đi, tuổi trẻ ngắn ngủi, vẻ đẹp không thể giữ nguyên. Càng yêu đời, nhà thơ càng lo âu trước sự mất mát.",null,[["Nghệ thuật","Thủ pháp tương phản giữa cái vô hạn của vũ trụ và cái hữu hạn của đời người làm nổi bật cảm thức thời gian mới mẻ, hiện đại."]],"hourglass","Dòng thời gian","Nỗi lo thời gian không bắt nguồn từ bi quan, mà từ tình yêu cuộc sống quá đỗi thiết tha."],
["09 / Quan niệm sống","Tuổi trẻ là<br><em>món quà hữu hạn</em>","","Nhà thơ ý thức tuổi trẻ đẹp nhưng ngắn ngủi. Vì thế, con người không nên sống hờ hững, trì hoãn hay để những ngày tháng quý giá trôi qua vô nghĩa. Nhận thức về giới hạn đời người trở thành động lực sống tích cực.",null,[["Không phải","Sống hấp tấp, bất chấp mọi điều hay chạy theo hưởng thụ mù quáng."],["Mà là","Biết trân trọng hiện tại, chủ động yêu thương, học hỏi và tạo giá trị."]],"sprout","Mầm non lớn lên"],
["10 / Cao trào cảm xúc","Lời giục giã<br><em>sống hết mình</em>","","Cảm xúc được đẩy lên cao trào bằng những động từ mạnh, nhịp thơ gấp gáp và các hình ảnh giàu cảm giác. Ước muốn tận hưởng cuộc sống không còn là ý nghĩ mơ hồ mà trở thành lời thúc giục mãnh liệt: hãy đón nhận cuộc đời bằng tất cả giác quan và trái tim.",null,[["Thông điệp cốt lõi","Yêu cuộc sống không chỉ là ngắm nhìn vẻ đẹp, mà còn là sống chủ động, sâu sắc, biết trao đi tình cảm và không bỏ phí những điều tốt đẹp đang hiện hữu."]],"sun","Nắng rực rỡ"],
["11 / Đặc sắc nghệ thuật","Cảm xúc tạo nên<br><em>nhạc điệu bài thơ</em>","","Nội dung và hình thức hòa quyện: nhịp thơ càng gấp gáp, tình yêu đời càng hiện rõ.",null,[["Những nét nghệ thuật","• Thể thơ tự do: câu dài ngắn linh hoạt, phù hợp dòng cảm xúc.<br>• Điệp ngữ, liệt kê: tạo nhịp điệu dồn dập, cảm giác phong phú.<br>• Hình ảnh táo bạo: kết hợp cảm giác, làm thiên nhiên sống động.<br>• Giọng điệu đa sắc: say sưa, băn khoăn, sôi nổi và cuồng nhiệt.<br>• Cái tôi trữ tình: trực tiếp bộc lộ khát vọng cá nhân và triết lí sống."]],"music","Giai điệu thi ca"],
["12 / Đối thoại văn học","Đặt “Vội vàng”<br><em>bên những thi phẩm khác</em>","","",null,[["Với “Tràng giang” – Huy Cận","Cả hai đều mang cái tôi cá nhân và nỗi ám ảnh trước không gian, thời gian. “Vội vàng” hướng ra cuộc đời bằng tình yêu nồng nhiệt, muốn tận hưởng và níu giữ; “Tràng giang” nghiêng về nỗi cô đơn, cảm giác nhỏ bé giữa vũ trụ rộng lớn."],["Với “Sóng” – Xuân Quỳnh","Cùng thể hiện trái tim yêu mãnh liệt và khát vọng sống trọn vẹn. Xuân Diệu mở rộng tình yêu ra toàn bộ vẻ đẹp trần thế; Xuân Quỳnh tập trung khám phá những cung bậc tinh tế, khát vọng thủy chung trong tình yêu đôi lứa."]],"twoflowers","Hai sắc hoa"],
["13 / Giá trị và ý nghĩa","Bài thơ nhắc ta<br><em>đừng sống hờ hững</em>","Hãy biết quý hiện tại, bởi mỗi khoảnh khắc đi qua đều không thể trở lại.","",null,[["Giá trị nội dung","Ca ngợi vẻ đẹp của thiên nhiên, tuổi trẻ và cuộc sống trần thế; thể hiện tình yêu đời say đắm cùng nỗi trăn trở trước thời gian, từ đó khẳng định khát vọng sống có ý nghĩa."],["Giá trị nghệ thuật","Góp phần làm mới thơ ca bằng cái tôi cá nhân táo bạo, ngôn ngữ giàu cảm giác, hình ảnh độc đáo, nhịp điệu linh hoạt và giọng thơ nồng nàn."]],"heart","Trái tim"],
["14 / Cùng suy ngẫm","Mang theo điều gì<br><em>sau khu vườn này?</em>","","",null,[["Bài học gợi ra từ tác phẩm","• Biết quan sát và trân trọng vẻ đẹp bình dị quanh mình.<br>• Quý trọng thời gian, tuổi trẻ và những cơ hội đang có.<br>• Sống chủ động, có mục tiêu, dám theo đuổi điều tốt đẹp.<br>• Yêu thương chân thành, kết nối với mọi người và thiên nhiên.<br>• Không đồng nhất “sống vội” với sống cẩu thả; hãy sống nhanh trong khát vọng nhưng sâu sắc trong lựa chọn."]],"tree","Cây đời","Sống hết mình không phải là làm mọi thứ thật nhanh, mà là không để trái tim nguội lạnh trước cuộc đời."],

data.forEach((d,i)=>{const s=document.createElement('section');s.className='slide fx-'+(i%6)+(i===14?' single':'');let h='<div class="copy"><div class="eyebrow">'+d[0]+'</div><h2 class="title">'+d[1]+'</h2>';if(d[2])h+='<p class="lead">'+d[2]+'</p>';if(d[3])h+='<p class="subtitle">'+d[3]+'</p>';if(d[4])h+='<div>'+d[4].map(t=>'<span class="tag">'+t+'</span>').join('')+'</div>';if(d[5])h+=d[5].map(p=>'<div class="panel"><h3>'+p[0]+'</h3><p>'+p[1]+'</p></div>').join('');if(d[8])h+='<div class="quote">'+d[8]+'</div>';if(i===14)h+='<p><button class="restart" onclick="go(0)">↻ Xem lại từ đầu</button></p>';h+='</div>';if(i!==14)h+='<div class="art"><div class="sun-disc"></div><div class="float-label a">☀ '+d[7]+'</div><div class="plant-card"><svg viewBox="0 0 450 400" role="img" aria-label="Minh họa '+d[7]+'">'+art[d[6]]+'</svg></div><div class="float-label b">🌿 grow with joy</div></div>';s.innerHTML=h;root.appendChild(s)});
const slides=[...document.querySelectorAll('.slide')];let current=0;
function go(n){current=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>{s.classList.remove('active');if(i===current){void s.offsetWidth;s.classList.add('active')}});document.getElementById('count').textContent=String(current+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');document.getElementById('progress').style.width=((current+1)/slides.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===slides.length-1}
document.getElementById('prev').onclick=()=>go(current-1);document.getElementById('next').onclick=()=>go(current+1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(current+1);if(e.key==='ArrowLeft')go(current-1)});
document.getElementById('begin').onclick=()=>{document.getElementById('intro').classList.add('hide');startMusic()};
let ctx=null,master=null,loopTimer=null,musicOn=false,nextStep=0;const melody=[523.25,659.25,783.99,659.25,587.33,698.46,880,698.46,523.25,659.25,783.99,1046.5,880,783.99,659.25,587.33],bass=[130.81,130.81,164.81,164.81,174.61,174.61,146.83,146.83],chords=[[261.63,329.63,392],[220,261.63,329.63],[174.61,220,261.63],[196,246.94,293.66]],beat=.28;
function tone(freq,t,dur,vol,type='sine'){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.04)}
function schedule(){while(nextStep<ctx.currentTime+.18){const k=Math.floor(nextStep/beat)%16,bar=Math.floor(k/4)%4;tone(melody[k],nextStep,.23,.11,'triangle');if(k%2===0)tone(bass[Math.floor(k/2)%8],nextStep,.38,.075);if(k%4===0)chords[bar].forEach(f=>tone(f,nextStep,.72,.018));if(k%4===2)tone(melody[k]*2,nextStep,.12,.025);nextStep+=beat}}
function startMusic(){if(musicOn)return;try{ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.55;master.connect(ctx.destination);nextStep=ctx.currentTime+.05;schedule();loopTimer=setInterval(schedule,70);musicOn=true;document.getElementById('sound').textContent='♫ Tắt giai điệu'}catch(e){document.getElementById('sound').textContent='Không bật được nhạc'}}
function stopMusic(){if(loopTimer)clearInterval(loopTimer);loopTimer=null;if(ctx){ctx.close();ctx=null}musicOn=false;document.getElementById('sound').textContent='♫ Bật giai điệu'}
document.getElementById('sound').onclick=()=>musicOn?stopMusic():startMusic();go(0);
